name: Publicar AllDoc

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      requested: ${{ steps.marker.outputs.requested }}
    steps:
      - name: Buscar el marcador de despliegue en los títulos
        id: marker
        run: |
          jq -r 'any(.commits[]?; (.message | split("\n")[0] | contains("[deploy]"))) | "requested=\(.)"' \
            "$GITHUB_EVENT_PATH" >> "$GITHUB_OUTPUT"

  deploy:
    needs: check
    if: needs.check.outputs.requested == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: alldoc-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: npm

      - name: Instalar dependencias de AllDoc
        run: |
          npm ci
          npm run prepare:python

      - name: Pruebas de código y tipos
        run: |
          npm test
          npm run typecheck
          npm run typecheck:tests

      - name: Instalar Firefox y WebKit
        run: npx playwright install --with-deps firefox webkit

      - name: Probar SQL y pandas en navegador
        run: npm run test:browser:smoke

      - name: Compilar AllDoc y el entorno de práctica
        env:
          SITE_URL: https://alldoc-dmo.pages.dev
          PRACTICE_APP_ORIGIN: https://alldoc-dmo.pages.dev
          PRACTICE_ORIGIN: https://alldoc-practica.andngdv-lpr.workers.dev
        run: |
          npm run build
          npm run build:runtime

      - name: Publicar en Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest deploy --name alldoc-practica --assets .runtime-build --compatibility-date 2026-11-23
          npx --yes wrangler@latest pages deploy build --project-name alldoc --branch main
